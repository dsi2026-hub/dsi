<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Border Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="lines"></div>
        <div class="imgBx">
            <img src="logo.png" alt="">
        </div>
        <div class="content">
            <div class="details">
                <h2>Mr. Skeleton<br><span>Senior UX/UI Designer
                    Player</span></h2>
            <div class="data">
                <h3>392<br><span>Posts</span></h3>
                <h3>6.5M<br><span>Followers</span></h3>
                <h3>194<br><span>Following</span></h3>
            </div>
            <div class="actionBtn">
                <button>Follow</button>
                <button>Message</button>
            </div>
            </div>
        </div>
    </div>
</body>
</html>
